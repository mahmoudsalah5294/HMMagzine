<!DOCTYPE html>
<html class="no-js">

<head>
  <meta charset="utf-8">
  <title>Favorite Offers</title>
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link rel="shortcut icon" href="img/favicon.ico">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f1efee;
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 20px;
    }

    main {
      flex: 1;
      padding: 20px;
    }

    .offer-card {
      background-color: white;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .offer-content {
      max-width: 85%;
    }

    .offer-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .heart-icon {
      font-size: 24px;
      color: red;
      cursor: pointer;
    }

    .favorited {
      color: #e60023;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>

<body>
  <div id="wrapper">
    <header>
      <h2>Favorite Offers</h2>
    </header>
    <main id="offers-container"></main>
    <footer id="footer"></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./core/supabase.js"></script>
  <script src="js/favorites.js"></script>
  <script src="core/inject-layout.js"></script>
</body>

</html>
